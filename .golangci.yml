version: "2"

run:
  # Integration test files are linted too; their build tag would hide them otherwise.
  build-tags:
    - integration

# The standard linters (errcheck, govet, ineffassign, staticcheck, unused), plus gosec on the shipped code.
linters:
  enable:
    - gosec
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Tests re-exec their own binary, read testdata and seed math/rand on purpose.
      - path: _test\.go
        linters:
          - gosec
