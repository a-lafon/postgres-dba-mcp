name: Feature request
description: A problem the tools do not solve yet, or solve badly.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you tried to do with the server, on what kind of database, and where it fell short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What the tool or its output could do instead. Optional.
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Claude Code, Codex, Cursor...
