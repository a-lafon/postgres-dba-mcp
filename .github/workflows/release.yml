name: release

# Runs on version tags only. Linux binaries are cgo static musl builds cross-compiled with zig cc
# (.goreleaser.yaml); darwin and windows are CGO_ENABLED=0, so the plain runner plus zig is enough.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release and upload the archives
  packages: write # push the image to GHCR

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test -race ./...
      - name: Known vulnerabilities in the code paths used
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: Smoke test the snapshot binary
        run: scripts/smoke-initialize.sh dist/linux_linux_amd64_v1/postgres-dba-mcp
      - name: Smoke test the snapshot image
        run: |
          image=$(docker image ls --format '{{.Repository}}:{{.Tag}}' ghcr.io/a-lafon/postgres-dba-mcp | grep -- '-amd64$' | head -n 1)
          test -n "$image"
          scripts/smoke-initialize.sh docker run -i --rm -e DATABASE_URI "$image"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A fine-grained token that writes the Homebrew tap only: GITHUB_TOKEN cannot write to another repository.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
