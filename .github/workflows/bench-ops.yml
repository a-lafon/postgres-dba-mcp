name: bench-ops

# The operations figures of the benchmark (bench/PROTOCOL.md §9): image size, cold start and memory of the five
# servers, each from its pinned image. They run here, on x86-64, because on an arm64 Mac an amd64-only image would run
# emulated. Run by hand only: Actions tab, or `gh workflow run bench-ops.yml`. No secret, no model.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Actions are pinned to a commit: a tag of a third-party action can be moved.
jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: bench
    env:
      RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bench/go.mod
          cache-dependency-path: bench/go.sum
      - name: Start the bench database
        run: docker compose -f compose.yml up -d --build --wait pg
      # ops reads Pagila's rental table (S02) and runs SELECT 1; neither depends on --scale, so the smallest scale
      # keeps the measure intact and the load short. Pagila is loaded at every scale.
      - name: Load the data
        run: go run ./cmd/bench load --scale=0.01
      - name: Operations
        run: go run ./cmd/bench ops --run="$RUN_ID" --servers=dba,crystal,dbhub,toolbox,reference
      - name: Runner
        if: always()
        run: |
          mkdir -p "results/$RUN_ID"
          {
            echo "runner: ${RUNNER_OS} ${RUNNER_ARCH}, ${ImageOS:-} ${ImageVersion:-}"
            lscpu | grep -E '^(Architecture|Model name|CPU\(s\)|Thread\(s\) per core):'
            free -h | head -2
            docker version --format 'docker {{.Server.Version}}'
          } | tee "results/$RUN_ID/runner.txt"
      - name: Summary
        if: always()
        run: |
          {
            echo '## Operations'
            echo
            cat "results/$RUN_ID/ops.md" 2>/dev/null || echo 'ops did not finish.'
            echo
            echo '```'
            cat "results/$RUN_ID/runner.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-ops-${{ env.RUN_ID }}
          path: bench/results/${{ env.RUN_ID }}/
          if-no-files-found: error
      - name: Database logs
        if: failure()
        run: docker compose -f compose.yml logs pg
